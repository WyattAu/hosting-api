# Estate gate matrix (engineering-standards) — SIS round 12 iter 71 retrofit.
name: quality
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  quality:
    uses: WyattAu/engineering-standards/.github/workflows/rust-kit.yml@main
    with:
      tier: b
      all-features: true
      loom: false
      wasm: false
      miri: false
      # main.rs is axum bootstrap glue (bind+serve, untestable without a
      # full server harness); nightly.rs closures need a live AppState —
      # both tracked for integration-test coverage in the SIS loop backlog.
      coverage-ignore-regex: "(main|nightly)\\.rs$"
