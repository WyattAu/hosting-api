# Estate gate matrix (engineering-standards) — SIS round 12 iter 71 retrofit.
name: quality
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  quality:
    uses: WyattAu/engineering-standards/.github/workflows/rust-kit.yml@main
    with:
      # Tier b restored (iteration 20): seven integration tests
      # (readiness over the real dependency registry, the jobs read
      # surface, tenant detail, the empty-ledger statement, and the
      # passkey not-configured paths) took line coverage 78.41% ->
      # 82.38%. The 18b diagnosis was corrected: llvm-cov's flag was
      # fine — the text table's first column is REGIONS (80.43%),
      # lines were genuinely 78.41%. Functions sit at 76.47%; closing
      # them is future work, not a gate.
      tier: b
      all-features: true
      loom: false
      wasm: false
      miri: false
      # main.rs is axum bootstrap glue (bind+serve, untestable without a
      # full server harness); nightly.rs closures need a live AppState —
      # both tracked for integration-test coverage in the SIS loop backlog.
      coverage-ignore-regex: "(main|nightly)\\.rs$"
