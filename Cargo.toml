[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
authors = ["Wyatt Au <wyatt_au@protonmail.com>"]
repository = "https://github.com/WyattAu/hosting-api"

# Estate tier-a lint posture (mirrors OmniRust-template): deny the panic
# family, take pedantic seriously.
[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
module_name_repetitions = "allow"
multiple_crate_versions = "allow"

[workspace.dependencies]
# Dogfood: the estate's own crates, published on crates.io.
telemetry-init = "0.1"
metrics-kit = "0.2"  # telemetry-init 0.1.2 (republish wave) aligns on 0.2
worker-kit = { version = "0.3", features = ["cron"] }
shutdown-kit = "0.3"
webauthn-kit = { version = "0.4", features = ["serde"] }
billing-kit = "0.2"  # metering money math (CurrencyAmount/Price)
ledger-kit = "0.1"   # double-entry journal for closed metering windows
outbox-kit = { version = "0.2", features = ["sqlite"] }  # durable outbox behind the ledger
healthkit = "1.2"    # liveness/readiness routes (estate dogfood)
oauth-toolkit = "0.4" # OIDC validation for /api JWTs (estate issuer: authbox)
url = "2"            # issuer URL validation
throttle-kit = { version = "1.1", features = ["tower"] }  # estate GCRA (dir: ratelimit)    # GCRA edge protection (estate dogfood)
envstack = "0.2"     # layered config (estate dogfood)
jsonwebtoken = "9"   # dev: sign fixture tokens for the OIDC test
p256 = { version = "0.13", features = ["pem", "ecdsa"] }  # dev: ES256 fixture key
rand_core = { version = "0.6", features = ["getrandom"] }  # dev: fixture keygen
base64 = "0.22"  # dev: fixture JWKS coords

tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "process", "time"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1

# TEMPORARY (SIS round 7 iter 64): pulls the algorithm-aware JWKS
# validator until oauth-toolkit 0.4.1 publishes. REMOVE on publish.
[patch.crates-io]
oauth-toolkit = { path = "../oauth-toolkit" }
