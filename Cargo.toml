[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
authors = ["Wyatt Au <wyatt_au@protonmail.com>"]
repository = "https://github.com/WyattAu/hosting-api"

# Estate tier-a lint posture (mirrors OmniRust-template): deny the panic
# family, take pedantic seriously.
[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
module_name_repetitions = "allow"
multiple_crate_versions = "allow"

[workspace.dependencies]
# Dogfood: the estate's own crates, published on crates.io.
telemetry-init = "0.1"
metrics-kit = "0.1"  # align with telemetry-init 0.1.1 (0.2 dep not yet republished upstream)

tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "process", "time"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
